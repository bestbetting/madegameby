<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>투자 시뮬레이터</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
    background:#f4f6f9;
    padding:15px;
}

.container{
    max-width:900px;
    margin:auto;
}

.card{
    background:white;
    padding:15px;
    border-radius:15px;
    margin-bottom:15px;
    box-shadow:0 3px 10px rgba(0,0,0,0.08);
}

h1{
    text-align:center;
    margin-bottom:15px;
}

.money{
    font-size:1.2rem;
    font-weight:bold;
}

.asset{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:10px 0;
    flex-wrap:wrap;
    gap:5px;
}

button{
    border:none;
    padding:8px 12px;
    border-radius:8px;
    cursor:pointer;
}

.buy{
    background:#2ecc71;
    color:white;
}

.sell{
    background:#e74c3c;
    color:white;
}

.next{
    width:100%;
    background:#3498db;
    color:white;
    padding:12px;
    font-size:1rem;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    padding:8px;
    border-bottom:1px solid #ddd;
    text-align:center;
}

@media(max-width:600px){
    .asset{
        flex-direction:column;
        align-items:flex-start;
    }
}
</style>
</head>
<body>

<div class="container">

<h1>📈 투자 시뮬레이터</h1>

<div class="card">
    <div class="money" id="cash"></div>
    <div id="month"></div>
    <div id="total"></div>
    <div id="profit"></div>
</div>

<div class="card">
    <h2>사용법</h2>
    <p>
        • 초기 자금 100만원<br>
        • 매수/매도로 포트폴리오 구성<br>
        • 다음 달 버튼을 누르면 시장 변동<br>
        • 목표는 장기적으로 자산 증식
    </p>
</div>

<div class="card">
    <h2>시장</h2>
    <div id="market"></div>
</div>

<div class="card">
    <h2>보유 자산</h2>
    <table>
        <thead>
        <tr>
            <th>자산</th>
            <th>수량</th>
            <th>평가액</th>
        </tr>
        </thead>
        <tbody id="portfolio"></tbody>
    </table>
</div>

<button class="next" onclick="nextMonth()">⏭ 다음 달 진행</button>

</div>

<script>

let cash = 1000000;
let month = 1;
const startMoney = 1000000;

const assets = [
    {name:"삼성전자", price:70000},
    {name:"S&P500 ETF", price:50000},
    {name:"나스닥100 ETF", price:60000},
    {name:"금", price:100000},
    {name:"미국국채", price:30000}
];

const holdings = {};

assets.forEach(a=>{
    holdings[a.name]=0;
});

function updateUI(){

    document.getElementById("cash").innerText =
        "현금: "+Math.round(cash).toLocaleString()+"원";

    document.getElementById("month").innerText =
        month+"개월차";

    let total = cash;

    assets.forEach(a=>{
        total += holdings[a.name]*a.price;
    });

    let profit =
        ((total-startMoney)/startMoney*100).toFixed(2);

    document.getElementById("total").innerText =
        "총 자산: "+Math.round(total).toLocaleString()+"원";

    document.getElementById("profit").innerText =
        "수익률: "+profit+"%";

    let marketHTML="";

    assets.forEach((a,i)=>{

        marketHTML+=`
        <div class="asset">
            <div>
                <strong>${a.name}</strong><br>
                가격: ${Math.round(a.price).toLocaleString()}원
            </div>

            <div>
                <button class="buy" onclick="buy(${i})">매수</button>
                <button class="sell" onclick="sell(${i})">매도</button>
            </div>
        </div>
        `;
    });

    document.getElementById("market").innerHTML =
        marketHTML;

    let portfolioHTML="";

    assets.forEach(a=>{

        portfolioHTML+=`
        <tr>
            <td>${a.name}</td>
            <td>${holdings[a.name]}</td>
            <td>${Math.round(
                holdings[a.name]*a.price
            ).toLocaleString()}원</td>
        </tr>
        `;
    });

    document.getElementById("portfolio").innerHTML =
        portfolioHTML;
}

function buy(index){

    let asset = assets[index];

    if(cash >= asset.price){

        cash -= asset.price;
        holdings[asset.name]++;

        updateUI();
    }
    else{
        alert("현금 부족!");
    }
}

function sell(index){

    let asset = assets[index];

    if(holdings[asset.name] > 0){

        holdings[asset.name]--;
        cash += asset.price;

        updateUI();
    }
    else{
        alert("보유 수량 없음!");
    }
}

function nextMonth(){

    month++;

    assets.forEach(a=>{

        let change;

        if(a.name==="미국국채"){
            change=(Math.random()*4)-1;
        }
        else if(a.name==="금"){
            change=(Math.random()*10)-3;
        }
        else{
            change=(Math.random()*20)-10;
        }

        a.price *= (1 + change/100);

        if(a.price<1000){
            a.price=1000;
        }
    });

    updateUI();
}

updateUI();

</script>

</body>
</html>
